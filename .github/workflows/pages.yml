name: Publish market dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # UTC; China morning/afternoon sessions. GitHub schedules may be delayed.
    - cron: '*/5 1-3,5-6 * * 1-5'
    - cron: '10 7,12,22 * * 1-5'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: web-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web-dashboard/package-lock.json
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm test
      - run: npm run snapshot
      - run: npm run build && npm run validate
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-dashboard/dist/public
          retention-days: 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
